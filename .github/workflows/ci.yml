name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/loopwork?schema=public"
  PRISMA_FIELD_ENCRYPTION_KEY: "k1.aes-gcm-256.12345678901234567890123456789012"
  JWT_SECRET: "dummy_jwt_secret_for_ci_build_testing_purposes_only"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  mailer_smtp_host: "localhost"
  mailer_smtp_port: "1025"
  mailer_smtp_isSecure: "false"
  mailer_smtp_user: "user"
  mailer_smtp_password: "password"
  mailer_email_from: "Loopwork <test@example.com>"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Lint and type check
        run: yarn lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Build
        run: yarn build
